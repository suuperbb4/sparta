<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>비티 카드</title>
<meta name="theme-color" content="#0b0e14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="비티 카드">
<script>
  // 아이폰·아이패드는 매니페스트가 있으면 홈 화면 아이콘이 코드 없는 시작 주소로 열린다.
  // 매니페스트를 빼면 지금 주소(?k=코드 포함)가 그대로 저장돼, 아이콘으로 열 때 자동 연동된다.
  // 안드로이드는 브라우저와 설치 앱이 저장 공간을 같이 써서 매니페스트를 그대로 둔다.
  (function () {
    var ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    if (!ios) { var l = document.createElement('link'); l.rel = 'manifest'; l.href = 'manifest.webmanifest'; document.head.appendChild(l); }
  })();
</script>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="app"><div class="body pad"><p class="muted">불러오는 중…</p></div></div>
<script src="app.js"></script>
</body>
</html>
