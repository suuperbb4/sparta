function addD(s,n){const d=pd(s);d.setDate(d.getDate()+n);return iso(d)}

  if(d<'2027-01-01')return PHASES[0]; if(d<'2027-03-01')return PHASES[1]; if(d<=e1)return PHASES[2]; if(d<=e2)return PHASES[3]; return null}
function phaseRange(p){const e1=S.settings.e1,e2=S.settings.e2;
  return [['2026-11-16','2026-12-31'],['2027-01-01','2027-02-28'],['2027-03-01',e1],[addD(e1,1),e2]][p.id-1]}
function blocksFor(d){const p=phaseOf(d);if(!p)return[];const w=pd(d).getDay();if(w===0)return[];return w===6?p.sat:p.wd}
/* 기상 목표: 2026-11-17 07:15에서 시작해 3일마다 15분씩 당겨 06:00에 고정 */
function wakeGoal(d){const n=Math.max(0,diff('2026-11-17',d));const m=Math.max(360,435-Math.floor(n/3)*15);return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}

  const P=[['틀린 것만 다시 꺼내 쓴다','다시 읽기와 밑줄은 효과가 낮고, 스스로 떠올려 보는 연습과 간격을 둔 반복이 효과가 높다고 평가됩니다(Dunlosky 외, 2013). 밤 40분 백지 회상과 토요일 누적 복습이 이 역할입니다.'],
    ['기록해서 보여 준다','진행 상황을 적어 두고 남에게 보고할 때 목표 달성 효과가 더 컸습니다(Harkin 외, 2016, 138개 실험 종합). 오늘 탭 기록과 이 코치 탭이 그 장치입니다.'],
    ['하루 빠져도 습관은 깨지지 않는다','습관이 자동이 되기까지 걸린 기간의 중앙값은 66일, 사람에 따라 18~254일이었고 하루 빠진 것은 영향이 거의 없었습니다(Lally 외, 2010). 빠진 날은 메우지 않고 다음 날 정해진 블록부터 합니다.'],
    ['언제·어디서·무엇을 미리 정한다','“일어나면 책상에 펴 둔 세무회계연습 첫 문제를 푼다”처럼 조건과 행동을 묶어 두면 실행률이 올라갑니다(Gollwitzer·Sheeran, 2006). 전날 밤 첫 문제를 펴 두세요.'],
    ['잠을 줄여서 시간을 만들지 않는다','6시간 수면을 2주 이어 가면 하루 이틀 밤을 새운 수준으로 수행이 떨어지는데 본인은 잘 느끼지 못한다는 실험이 있습니다(Van Dongen 외, 2003). 수면 7시간을 먼저 지킵니다.'],
    ['휴대폰은 의지가 아니라 환경으로 막는다','유혹이 생긴 뒤 참는 것보다 유혹이 생기기 전에 상황을 바꾸는 전략이 더 효과적이라는 정리가 있습니다(Duckworth·Gendler·Gross, 2016). 공부는 Bigme(유튜브 없음)로만, 아이폰은 공부 공간 밖 제자리에 두고 09:00·12:00·17:00에만 확인합니다. 평일 낮 유튜브는 다운타임으로 막고 주말은 그대로 둡니다. 쉬는 시간에는 자리를 뜨고, 영상 시간은 매일 기록합니다.'],
    ['밀린 것은 토요일 2시간 안에서만 메운다','밀린 블록을 평일에 얹으면 다음 날이 무너집니다. 토요일 첫 2시간에 들어가지 않는 것은 버리고, 같은 일이 2주 이어지면 계획을 줄입니다.']];
  return h('section',{class:'view'},
    h('div',{class:'panel'},h('h2',{text:'코치 피드백'}),
      h('p',{class:'note',text:'매주 수요일 밤과 토요일 낮에 Claude가 이 플래너의 기록을 읽고 여기에 피드백을 올립니다. 급한 질문은 Claude 대화창에 바로 쓰면 됩니다.'}),
      S.coach.length?S.coach.map(c=>h('div',{class:'phase cur'},h('b',{text:c.title||''}),h('span',{class:'note num',text:c.id}),h('ul',{class:'plain'},(c.items||[]).map(x=>h('li',{text:String(x)}))))):
        h('p',{class:'note',text:'아직 올라온 피드백이 없습니다.'})),
    h('div',{class:'panel'},h('h2',{text:'이번 주 돌아보기'}),
      h('p',{class:'note',text:'금요일 밤이나 토요일 오전에 세 줄만 적어 두세요. 토요일 피드백이 이 내용에 답합니다.'}),
      ta('w-good','이번 주에 된 것','g'),ta('w-bad','막힌 것, 못 지킨 것과 이유','b'),ta('w-ask','코치에게 묻고 싶은 것','q')),
    h('div',{class:'panel'},h('h2',{text:'오래 가는 방법'}),P.map(x=>h('div',{class:'phase'},h('b',{text:x[0]}),h('p',{class:'note',text:x[1]})))));
}
const VIEWS={today:vToday,books:vBooks,roadmap:vRoadmap,analysis:vAnalysis,strategy:vStrategy,log:vLog,coach:vCoach};
function render(){view=(location.hash||'#today').slice(1);if(!VIEWS[view])view='today';header();
  const m=document.getElementById('main');m.replaceChildren(VIEWS[view]())}
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});

/* ---------- 시작 ---------- */
loadCache();render();
(async()=>{
  try{
    if(!window.claude||!window.claude.use){setSync('이 기기에만 저장됩니다');return}
    const [u,d]=await Promise.all([window.claude.use('user'),window.claude.use('db')]);
    const uid=u?await u.id():null;
    if(!d||!uid){setSync('이 기기에만 저장됩니다');return}
    db=d;const c=db.collection('data/users/'+uid);
    setSync('기록을 불러오는 중…');
    const snap=await Promise.race([c.get(),new Promise((_,r)=>setTimeout(()=>r(new Error('t')),10000))]);
    snap.docs.forEach(x=>{const b=JSON.parse(JSON.stringify(x.data()||{}));
      if(x.id==='settings')Object.assign(S.settings,b);
      else if(x.id==='books')S.books=b.items||[];
      else if(x.id==='mocks')S.mocks=b.items||[];
      else if(x.id[0]==='w')S.weeks[x.id.slice(1)]=b;
      else if(x.id[0]==='d'){b.c=b.c||{};S.days[x.id.slice(1)]=b}});
    try{const cs=await db.collection('coach').get();S.coach=cs.docs.map(x=>Object.assign({id:x.id},JSON.parse(JSON.stringify(x.data()||{})))).sort((a,b)=>a.id<b.id?1:-1).slice(0,6)}catch(e){}
    col=c;cache();setSync('기록을 불러왔습니다');render();
  }catch(e){setSync('서버 기록을 불러오지 못했습니다. 이 기기에 저장된 내용으로 표시합니다');}
})();
</script>
