name: 비티 카드 목록 갱신

on:
  push:
    paths:
      - 'btcard/cards/**'
  workflow_dispatch:

permissions:
  contents: write

# 카드 9장이 한 장씩 올라와도 마지막 한 번만 목록을 만들게 한다
concurrency:
  group: btcard-feed
  cancel-in-progress: true

jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/build-feed.mjs
      - name: 바뀐 목록 저장
        run: |
          if git diff --quiet -- btcard/feed.json; then
            echo "변경 없음"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add btcard/feed.json
            git commit -m "비티 카드 목록 갱신"
            git push
          fi
